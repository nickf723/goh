name: Runtime performance validation

on:
  push:
    branches:
      - main
    paths:
      - "scripts/performance/**"
      - "scripts/ui/game_ui_unified.gd"
      - "scripts/ui/unified_hud_source_bridge_budgeted.gd"
      - "scripts/ui/player_hud_unified_budgeted.gd"
      - "scripts/ui/quick_spell_belt_unified.gd"
      - "scenes/actors/player/player.tscn"
      - "scripts/physics/field_responsive_body.gd"
      - "scripts/levels/mechanism_network_lab_value.gd"
      - "scripts/levels/mechanism_network_lab_performance.gd"
      - "scripts/levels/mechanism_network_lab_soul_weights.gd"
      - "scripts/levels/mechanism_network_lab_routing.gd"
      - "scripts/levels/mechanism_network_lab_priority_decoder.gd"
      - "scripts/mechanisms/mechanism_signal_node.gd"
      - "scripts/mechanisms/mechanism_output_adapter.gd"
      - "scripts/mechanisms/pressure_plate_switch.gd"
      - "scripts/mechanisms/mechanism_value_comparator.gd"
      - "scripts/mechanisms/mechanism_value_elevator.gd"
      - "scripts/mechanisms/mechanism_weight_block.gd"
      - "scripts/mechanisms/mechanism_selector_source.gd"
      - "scripts/mechanisms/mechanism_router_node.gd"
      - "scripts/mechanisms/mechanism_multiplexer_node.gd"
      - "scripts/mechanisms/mechanism_priority_selector.gd"
      - "scripts/mechanisms/mechanism_decoder_node.gd"
      - "scripts/mechanisms/mechanism_sliding_gate.gd"
      - "scripts/mechanisms/mechanism_indicator.gd"
      - "scripts/mechanisms/mechanism_element_sensor.gd"
      - "scenes/mechanisms/mechanism_value_elevator.tscn"
      - "scenes/mechanisms/mechanism_weight_block.tscn"
      - "scenes/ui/game_ui.tscn"
      - "scenes/levels/prototypes/prototype_mechanism_network_lab_v1.tscn"
      - "scripts/tests/runtime_performance_foundation_smoke_test.gd"
      - "scenes/tests/runtime_performance_foundation_smoke_test.tscn"
      - "scripts/tests/runtime_performance_incremental_census_smoke_test.gd"
      - "scenes/tests/runtime_performance_incremental_census_smoke_test.tscn"
      - "scripts/tests/hud_idle_budget_smoke_test.gd"
      - "scenes/tests/hud_idle_budget_smoke_test.tscn"
      - "scripts/tests/mechanism_value_signal_smoke_test.gd"
      - "scenes/tests/mechanism_value_signal_smoke_test.tscn"
      - "scripts/tests/mechanism_soul_weight_smoke_test.gd"
      - "scenes/tests/mechanism_soul_weight_smoke_test.tscn"
      - "scripts/tests/mechanism_routing_smoke_test.gd"
      - "scenes/tests/mechanism_routing_smoke_test.tscn"
      - "scripts/tests/mechanism_priority_decoder_smoke_test.gd"
      - "scenes/tests/mechanism_priority_decoder_smoke_test.tscn"
      - "docs/PERFORMANCE_FOUNDATION_V1.md"
      - ".github/workflows/runtime-performance-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-performance-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-performance-foundation:
    name: Import and performance regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee performance-import.log

      - name: Run performance foundation regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/runtime_performance_foundation_smoke_test.tscn 2>&1 | tee performance-test.log

      - name: Run incremental F7 census regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/runtime_performance_incremental_census_smoke_test.tscn 2>&1 | tee performance-census-test.log

      - name: Run HUD idle-budget regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/hud_idle_budget_smoke_test.tscn 2>&1 | tee hud-idle-budget-test.log

      - name: Run mechanism network regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/mechanism_network_smoke_test.tscn 2>&1 | tee mechanism-test.log

      - name: Run mechanism value regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/mechanism_value_signal_smoke_test.tscn 2>&1 | tee mechanism-value-test.log

      - name: Run Soul-grippable mechanism weight regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/mechanism_soul_weight_smoke_test.tscn 2>&1 | tee mechanism-soul-weight-test.log

      - name: Run mechanism routing regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/mechanism_routing_smoke_test.tscn 2>&1 | tee mechanism-routing-test.log

      - name: Run priority and decoder regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/mechanism_priority_decoder_smoke_test.tscn 2>&1 | tee mechanism-priority-decoder-test.log

      - name: Run unified HUD regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/unified_hud_shell_smoke_test.tscn 2>&1 | tee hud-test.log

      - name: Run lab resource regeneration regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/lab_resource_regenerator_smoke_test.tscn 2>&1 | tee lab-resource-test.log

      - name: Upload performance validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-performance-validation-logs
          path: |
            performance-import.log
            performance-test.log
            performance-census-test.log
            hud-idle-budget-test.log
            mechanism-test.log
            mechanism-value-test.log
            mechanism-soul-weight-test.log
            mechanism-routing-test.log
            mechanism-priority-decoder-test.log
            hud-test.log
            lab-resource-test.log
          if-no-files-found: ignore
