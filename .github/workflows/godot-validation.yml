name: Godot validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Plan size ${{ matrix.expected }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        expected: [0, 1, 2, 3, 4, 5, 6]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Probe map launch plan size
        env:
          ROUTE_STAGE: initial_plan_size_probe
          EXPECTED_ROUTE_SIZE: ${{ matrix.expected }}
        run: godot --headless --path . res://scenes/tests/validation_route_familiarity_map_stage.tscn
