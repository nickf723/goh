name: Godot validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Focused airborne presentation validation
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Run airborne reaction smoke test
        run: godot --headless --path . scenes/tests/hit_reaction_smoke_test.tscn

      - name: Run airborne presentation smoke test
        run: godot --headless --path . scenes/tests/airborne_presentation_smoke_test.tscn

      - name: Boot airborne presentation lab headlessly
        run: godot --headless --path . scenes/levels/prototypes/prototype_airborne_presentation_lab_v1.tscn --quit-after 6

      - name: Boot combo arena regression
        run: godot --headless --path . scenes/levels/prototypes/prototype_weapon_combat_arena_v1.tscn --quit-after 5
