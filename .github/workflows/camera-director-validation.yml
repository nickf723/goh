name: Camera Director

on:
  push:
    branches:
      - main
    paths:
      - "scripts/camera/camera_profile.gd"
      - "scripts/camera/camera_zone_3d.gd"
      - "scripts/camera/camera_director_3d.gd"
      - "data/camera/grace_exploration_camera.tres"
      - "scripts/tests/camera_director_smoke_test.gd"
      - "scenes/tests/camera_director_smoke_test.tscn"
      - "scenes/levels/prototypes/prototype_green_grotto_art_target_v1.tscn"
      - "scripts/visuals/player_motion_feedback.gd"
      - "scripts/player/player_controller.gd"
      - "scripts/player/player_controller_free_aim.gd"
      - "scripts/player/player_controller_free_aim_status.gd"
      - "docs/CAMERA_DIRECTOR_V1.md"
      - ".github/workflows/camera-director-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camera-director-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-camera-director:
    name: Import, camera contract, and Green boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee camera-import.log

      - name: Run Camera Director regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/camera_director_smoke_test.tscn 2>&1 | tee camera-test.log

      - name: Boot Green Grotto with camera and lighting directors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 8 res://scenes/levels/prototypes/prototype_green_grotto_art_target_v1.tscn 2>&1 | tee camera-green-boot.log

      - name: Upload Camera Director logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-director-logs
          path: |
            camera-import.log
            camera-test.log
            camera-green-boot.log
          if-no-files-found: ignore
