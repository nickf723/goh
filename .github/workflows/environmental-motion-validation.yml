name: Environmental Motion Director

on:
  push:
    branches:
      - main
    paths:
      - "scripts/environmental_motion/**"
      - "data/environmental_motion/**"
      - "scripts/levels/prototype_green_grotto_motion_pass.gd"
      - "scripts/tests/environmental_motion_director_smoke_test.gd"
      - "scenes/tests/environmental_motion_director_smoke_test.tscn"
      - "scenes/levels/prototypes/prototype_green_grotto_art_target_v1.tscn"
      - "scripts/airflow/airflow_manager.gd"
      - "scripts/airflow/airflow_field_3d.gd"
      - "docs/ENVIRONMENTAL_MOTION_DIRECTOR_V1.md"
      - ".github/workflows/environmental-motion-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: environmental-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-environmental-motion:
    name: Import, motion contract, and Green boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee environmental-motion-import.log

      - name: Run Environmental Motion Director regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/environmental_motion_director_smoke_test.tscn 2>&1 | tee environmental-motion-test.log

      - name: Boot Green Grotto benchmark
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 8 res://scenes/levels/prototypes/prototype_green_grotto_art_target_v1.tscn 2>&1 | tee environmental-motion-green-boot.log

      - name: Upload motion logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environmental-motion-logs
          path: |
            environmental-motion-import.log
            environmental-motion-test.log
            environmental-motion-green-boot.log
          if-no-files-found: ignore
