name: Mechanism network validation

on:
  push:
    branches:
      - main
    paths:
      - "scripts/mechanisms/**"
      - "scenes/mechanisms/**"
      - "scripts/physics/field_responsive_body.gd"
      - "scripts/levels/mechanism_network_lab.gd"
      - "scripts/levels/mechanism_network_lab_complete.gd"
      - "scripts/levels/mechanism_network_lab_value.gd"
      - "scripts/levels/mechanism_network_lab_performance.gd"
      - "scripts/levels/mechanism_network_lab_soul_weights.gd"
      - "scripts/levels/mechanism_network_lab_routing.gd"
      - "scripts/levels/mechanism_network_lab_priority_decoder.gd"
      - "scripts/levels/church_trial_chamber_of_accord.gd"
      - "scripts/levels/prototype_boss_dungeon_chain.gd"
      - "scenes/environment/church/church_trial_chamber_of_accord_v1.tscn"
      - "scenes/levels/prototypes/prototype_boss_dungeon_chain_v1.tscn"
      - "scenes/levels/prototypes/prototype_mechanism_network_lab_v1.tscn"
      - "scripts/tests/mechanism_network_smoke_test.gd"
      - "scenes/tests/mechanism_network_smoke_test.tscn"
      - "scripts/tests/mechanism_value_signal_smoke_test.gd"
      - "scenes/tests/mechanism_value_signal_smoke_test.tscn"
      - "scripts/tests/mechanism_soul_weight_smoke_test.gd"
      - "scenes/tests/mechanism_soul_weight_smoke_test.tscn"
      - "scripts/tests/mechanism_routing_smoke_test.gd"
      - "scenes/tests/mechanism_routing_smoke_test.tscn"
      - "scripts/tests/mechanism_priority_decoder_smoke_test.gd"
      - "scenes/tests/mechanism_priority_decoder_smoke_test.tscn"
      - "scripts/tests/church_trial_chamber_of_accord_smoke_test.gd"
      - "scenes/tests/church_trial_chamber_of_accord_smoke_test.tscn"
      - "docs/MECHANISM_NETWORK_V1.md"
      - "docs/MECHANISM_PRIORITY_DECODER_V1.md"
      - "docs/church_trial_chamber_of_accord_v1_test.md"
      - "docs/church_trial_vertical_slice_test.md"
      - ".github/workflows/mechanism-network-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mechanism-network-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mechanisms:
    name: Import and mechanism network regressions
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee mechanism-import.log

      - name: Run mechanism network regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/mechanism_network_smoke_test.tscn 2>&1 | tee mechanism-test.log

      - name: Run mechanism value signal regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/mechanism_value_signal_smoke_test.tscn 2>&1 | tee mechanism-value-test.log

      - name: Run Soul-grippable mechanism weight regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/mechanism_soul_weight_smoke_test.tscn 2>&1 | tee mechanism-soul-weight-test.log

      - name: Run mechanism routing regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/mechanism_routing_smoke_test.tscn 2>&1 | tee mechanism-routing-test.log

      - name: Run priority and decoder regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/mechanism_priority_decoder_smoke_test.tscn 2>&1 | tee mechanism-priority-decoder-test.log

      - name: Run Church Trial Chamber of Accord regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/church_trial_chamber_of_accord_smoke_test.tscn 2>&1 | tee chamber-of-accord-test.log

      - name: Upload mechanism validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mechanism-network-validation-logs
          path: |
            mechanism-import.log
            mechanism-test.log
            mechanism-value-test.log
            mechanism-soul-weight-test.log
            mechanism-routing-test.log
            mechanism-priority-decoder-test.log
            chamber-of-accord-test.log
          if-no-files-found: ignore
