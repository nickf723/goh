name: Visual LOD

on:
  push:
    branches:
      - main
    paths:
      - "scripts/visual_lod/**"
      - "data/visual_lod/**"
      - "scripts/levels/prototype_green_grotto_reflection_pass.gd"
      - "scripts/tests/visual_lod_director_smoke_test.gd"
      - "scenes/tests/visual_lod_director_smoke_test.tscn"
      - "docs/VISUAL_LOD_DIRECTOR_V1.md"
      - ".github/workflows/visual-lod-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-lod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-visual-lod:
    name: Import, LOD contract, and Green boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee visual-lod-import.log

      - name: Run Visual LOD regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/visual_lod_director_smoke_test.tscn 2>&1 | tee visual-lod-test.log

      - name: Boot Green Grotto benchmark
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 8 res://scenes/levels/prototypes/prototype_green_grotto_art_target_v1.tscn 2>&1 | tee visual-lod-green-boot.log

      - name: Upload LOD logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-lod-logs
          path: |
            visual-lod-import.log
            visual-lod-test.log
            visual-lod-green-boot.log
          if-no-files-found: ignore
