name: Systems integration hub validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Test integration hub
        run: godot --headless --path . scenes/tests/systems_integration_hub_smoke_test.tscn
      - name: Boot integration hub
        run: godot --headless --path . scenes/levels/prototypes/prototype_systems_integration_hub_v1.tscn --quit-after 5
