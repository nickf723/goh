name: Atmospheric Detail

on:
  push:
    branches:
      - main
    paths:
      - "scripts/atmosphere/**"
      - "data/atmosphere/**"
      - "scripts/environmental_motion/**"
      - "scripts/levels/prototype_green_grotto_reflection_pass.gd"
      - "scripts/tests/atmospheric_detail_smoke_test.gd"
      - "scenes/tests/atmospheric_detail_smoke_test.tscn"
      - "scenes/levels/prototypes/prototype_green_grotto_art_target_v1.tscn"
      - "docs/ATMOSPHERIC_DETAIL_DIRECTOR_V1.md"
      - ".github/workflows/atmospheric-detail-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atmospheric-detail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-atmospheric-detail:
    name: Import, atmosphere contract, and Green boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee atmospheric-detail-import.log

      - name: Run atmospheric detail regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/atmospheric_detail_smoke_test.tscn 2>&1 | tee atmospheric-detail-test.log

      - name: Boot Green Grotto benchmark
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 8 res://scenes/levels/prototypes/prototype_green_grotto_art_target_v1.tscn 2>&1 | tee atmospheric-detail-green-boot.log

      - name: Upload atmosphere logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atmospheric-detail-logs
          path: |
            atmospheric-detail-import.log
            atmospheric-detail-test.log
            atmospheric-detail-green-boot.log
          if-no-files-found: ignore
