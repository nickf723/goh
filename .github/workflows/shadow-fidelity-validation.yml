name: Shadow Fidelity Director

on:
  push:
    branches:
      - main
    paths:
      - "scripts/shadows/**"
      - "data/shadows/**"
      - "scripts/levels/prototype_green_grotto_shadow_pass.gd"
      - "scripts/tests/shadow_fidelity_director_smoke_test.gd"
      - "scenes/tests/shadow_fidelity_director_smoke_test.tscn"
      - "scenes/levels/prototypes/prototype_green_grotto_art_target_v1.tscn"
      - "scripts/lighting/**"
      - "scripts/vegetation/**"
      - "docs/SHADOW_FIDELITY_DIRECTOR_V1.md"
      - ".github/workflows/shadow-fidelity-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-shadow-fidelity:
    name: Import, shadow contract, and Green boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee shadow-fidelity-import.log

      - name: Run Shadow Fidelity regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/shadow_fidelity_director_smoke_test.tscn 2>&1 | tee shadow-fidelity-test.log

      - name: Boot Green Grotto benchmark
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 8 res://scenes/levels/prototypes/prototype_green_grotto_art_target_v1.tscn 2>&1 | tee shadow-fidelity-green-boot.log

      - name: Upload shadow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-fidelity-logs
          path: |
            shadow-fidelity-import.log
            shadow-fidelity-test.log
            shadow-fidelity-green-boot.log
          if-no-files-found: ignore
