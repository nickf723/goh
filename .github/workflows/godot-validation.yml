name: Godot validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Route familiarity plan-size probe
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Run route familiarity assembly test
        run: godot --headless --path . res://scenes/tests/route_familiarity_smoke_test.tscn

      - name: Plan size is zero
        continue-on-error: true
        env:
          ROUTE_STAGE: initial_plan_size_probe
          EXPECTED_ROUTE_SIZE: 0
        run: godot --headless --path . res://scenes/tests/validation_regional_route_stage.tscn

      - name: Plan size is one
        continue-on-error: true
        env:
          ROUTE_STAGE: initial_plan_size_probe
          EXPECTED_ROUTE_SIZE: 1
        run: godot --headless --path . res://scenes/tests/validation_regional_route_stage.tscn

      - name: Plan size is two
        continue-on-error: true
        env:
          ROUTE_STAGE: initial_plan_size_probe
          EXPECTED_ROUTE_SIZE: 2
        run: godot --headless --path . res://scenes/tests/validation_regional_route_stage.tscn

      - name: Plan size is three
        continue-on-error: true
        env:
          ROUTE_STAGE: initial_plan_size_probe
          EXPECTED_ROUTE_SIZE: 3
        run: godot --headless --path . res://scenes/tests/validation_regional_route_stage.tscn

      - name: Plan size is four
        continue-on-error: true
        env:
          ROUTE_STAGE: initial_plan_size_probe
          EXPECTED_ROUTE_SIZE: 4
        run: godot --headless --path . res://scenes/tests/validation_regional_route_stage.tscn

      - name: Plan size is five
        continue-on-error: true
        env:
          ROUTE_STAGE: initial_plan_size_probe
          EXPECTED_ROUTE_SIZE: 5
        run: godot --headless --path . res://scenes/tests/validation_regional_route_stage.tscn

      - name: Plan size is six
        continue-on-error: true
        env:
          ROUTE_STAGE: initial_plan_size_probe
          EXPECTED_ROUTE_SIZE: 6
        run: godot --headless --path . res://scenes/tests/validation_regional_route_stage.tscn

      - name: Finish probe
        run: echo "Inspect the one successful plan-size step."
