name: Drowned Chapel benchmark validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
      - name: Validate inventories
        run: |
          python scripts/ci/validate_capability_inventory.py
          python scripts/ci/validate_feature_registry.py
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Test Drowned Chapel benchmark environment
        run: timeout 90s godot --headless --path . scenes/tests/drowned_bell_environment_smoke_test.tscn
      - name: Test Drowned Bell crypt and quest completion
        run: timeout 90s godot --headless --path . scenes/tests/drowned_bell_crypt_smoke_test.tscn
      - name: Test global playability
        run: timeout 60s godot --headless --path . scenes/tests/global_playability_framework_smoke_test.tscn
      - name: Test Drowned Bell foundation
        run: timeout 60s godot --headless --path . scenes/tests/drowned_bell_foundation_smoke_test.tscn
      - name: Test authored quest regressions
        run: |
          timeout 60s godot --headless --path . scenes/tests/broken_waystation_consequence_smoke_test.tscn
          timeout 60s godot --headless --path . scenes/tests/ruined_village_approach_smoke_test.tscn
      - name: Boot Drowned Bell
        run: timeout 45s godot --headless --path . scenes/levels/prototypes/prototype_drowned_bell_v1.tscn --quit-after 9
      - name: Run full registered feature inventory
        run: python scripts/ci/run_feature_registry.py --godot godot
