name: Unified HUD validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-hud-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-unified-hud:
    name: Import and unified HUD regression
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Run unified HUD shell regression
        run: godot --headless --path . res://scenes/tests/unified_hud_shell_smoke_test.tscn
