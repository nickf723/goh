name: Life Vine Grapple

on:
  push:
    branches:
      - main
    paths:
      - "scripts/actions/life_vine_grapple.gd"
      - "scripts/actions/life_vine_grapple_targeted.gd"
      - "scripts/player/vine_grapple_targeting.gd"
      - "scripts/player/vine_grapple_target_preview.gd"
      - "scripts/ui/game_ui_compact_focus.gd"
      - "scripts/ui/game_ui_compact_focus_resolved.gd"
      - "scripts/ui/vine_grapple_marker_arbiter.gd"
      - "scripts/levels/prototype_vine_grapple_spell_trial.gd"
      - "scripts/tests/life_vine_grapple_smoke_test.gd"
      - "scripts/tests/vine_grapple_targeting_smoke_test.gd"
      - "scripts/tests/compact_focus_menu_smoke_test.gd"
      - "scenes/actions/life_vine_grapple.tscn"
      - "scenes/ui/game_ui.tscn"
      - "scenes/levels/prototypes/prototype_vine_grapple_spell_trial_v1.tscn"
      - "scenes/tests/life_vine_grapple_smoke_test.tscn"
      - "scenes/tests/vine_grapple_targeting_smoke_test.tscn"
      - "scenes/tests/compact_focus_menu_smoke_test.tscn"
      - "data/abilities/life_vine_grapple_ability.tres"
      - "data/flexible_materials/life_vine_grapple.tres"
      - "data/loadouts/grace_starting_loadout.tres"
      - ".github/workflows/vine-grapple-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: life-vine-grapple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-vine-grapple:
    name: Import, target clarity, compact Focus, and pull contract
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee vine-import.log

      - name: Boot Vine Grapple trial
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 res://scenes/levels/prototypes/prototype_vine_grapple_spell_trial_v1.tscn 2>&1 | tee vine-trial-boot.log

      - name: Run Vine Grapple pull regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/life_vine_grapple_smoke_test.tscn 2>&1 | tee vine-test.log

      - name: Run Vine Grapple targeting regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/vine_grapple_targeting_smoke_test.tscn 2>&1 | tee vine-targeting-test.log

      - name: Run compact Focus regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/compact_focus_menu_smoke_test.tscn 2>&1 | tee compact-focus-test.log

      - name: Run ground-target Focus ownership regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/ground_target_focus_ui_smoke_test.tscn 2>&1 | tee ground-target-focus-test.log

      - name: Run complete Focus library regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/complete_spell_library_smoke_test.tscn 2>&1 | tee complete-library-test.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-vine-grapple-logs
          path: |
            vine-import.log
            vine-trial-boot.log
            vine-test.log
            vine-targeting-test.log
            compact-focus-test.log
            ground-target-focus-test.log
            complete-library-test.log
          if-no-files-found: ignore
