name: Godot validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Atomic route map assertion validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
      - name: Import project headlessly
        run: godot --headless --path . --editor --quit
      - name: Run route familiarity assembly test
        run: godot --headless --path . res://scenes/tests/route_familiarity_smoke_test.tscn
      - name: Validate initial node
        env: { ROUTE_STAGE: initial_node }
        run: godot --headless --path . res://scenes/tests/validation_atomic_route_map_stage.tscn
      - name: Validate selected route
        env: { ROUTE_STAGE: initial_selection }
        run: godot --headless --path . res://scenes/tests/validation_atomic_route_map_stage.tscn
      - name: Validate context route
        env: { ROUTE_STAGE: initial_context_route }
        run: godot --headless --path . res://scenes/tests/validation_atomic_route_map_stage.tscn
      - name: Validate context state
        env: { ROUTE_STAGE: initial_context_state }
        run: godot --headless --path . res://scenes/tests/validation_atomic_route_map_stage.tscn
      - name: Validate plan type
        env: { ROUTE_STAGE: initial_plan_type }
        run: godot --headless --path . res://scenes/tests/validation_atomic_route_map_stage.tscn
      - name: Validate indices type
        env: { ROUTE_STAGE: initial_indices_type }
        run: godot --headless --path . res://scenes/tests/validation_atomic_route_map_stage.tscn
      - name: Validate plan size
        env: { ROUTE_STAGE: initial_plan_size }
        run: godot --headless --path . res://scenes/tests/validation_atomic_route_map_stage.tscn
      - name: Validate returned map
        env: { ROUTE_STAGE: returned }
        run: godot --headless --path . res://scenes/tests/validation_atomic_route_map_stage.tscn
      - name: Run Wilds regression
        run: godot --headless --path . res://scenes/tests/wilds_expedition_smoke_test.tscn
      - name: Boot regional map
        run: godot --headless --path . res://scenes/levels/prototypes/prototype_regional_expedition_map_v1.tscn --quit-after 4
      - name: Boot Wilds
        run: godot --headless --path . res://scenes/levels/prototypes/prototype_wilds_expedition_v1.tscn --quit-after 4
      - name: Boot combo arena
        run: godot --headless --path . res://scenes/levels/prototypes/prototype_weapon_combat_arena_v1.tscn --quit-after 4
