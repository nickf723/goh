name: Life Plant Summoning

on:
  push:
    branches:
      - main
    paths:
      - "scripts/actions/life_sprout_platform.gd"
      - "scripts/actions/life_sprout_platform_species.gd"
      - "scripts/abilities/ability_caster_plant_summons.gd"
      - "scripts/abilities/ability_caster_focus_library.gd"
      - "scripts/input/player_control_router_focus_grid.gd"
      - "scripts/life/plant_summon_definition.gd"
      - "scripts/life/plant_summon_catalog.gd"
      - "scripts/life/prepared_plant_loadout.gd"
      - "scripts/ui/full_menu_shell_plants.gd"
      - "scripts/ui/full_menu_shell_plant_spell_detail.gd"
      - "scripts/ui/full_menu_shell_feedback_v1.gd"
      - "scripts/ui/full_menu_shell_settings.gd"
      - "scripts/ui/game_ui_focus_minimal.gd"
      - "scripts/tests/sprout_smoke_test.gd"
      - "scripts/tests/plant_preparation_smoke_test.gd"
      - "scripts/tests/plant_spell_detail_smoke_test.gd"
      - "scripts/tests/compact_focus_menu_smoke_test.gd"
      - "scripts/tests/ground_target_focus_ui_smoke_test.gd"
      - "scenes/actions/life_sprout_platform.tscn"
      - "scenes/tests/sprout_smoke_test.tscn"
      - "scenes/tests/plant_preparation_smoke_test.tscn"
      - "scenes/tests/plant_spell_detail_smoke_test.tscn"
      - "data/abilities/sprout_ability.tres"
      - "data/plants/broadleaf_sprout.tres"
      - "data/loadouts/grace_starting_loadout.tres"
      - ".github/workflows/sprout-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: life-plant-summoning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-plant-summoning:
    name: Import, prepared plants, spell detail controls, aimed casting, and library
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee plant-import.log

      - name: Run prepared plant blueprint regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/plant_preparation_smoke_test.tscn 2>&1 | tee plant-preparation-test.log

      - name: Run Plant Summon spell-detail controls regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/plant_spell_detail_smoke_test.tscn 2>&1 | tee plant-spell-detail-test.log

      - name: Run Plant Summon actor regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/sprout_smoke_test.tscn 2>&1 | tee sprout-test.log

      - name: Run Focus controller regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/compact_focus_menu_smoke_test.tscn 2>&1 | tee focus-grid-test.log

      - name: Run ground-target ownership regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/ground_target_focus_ui_smoke_test.tscn 2>&1 | tee ground-target-test.log

      - name: Run complete Focus library regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/complete_spell_library_smoke_test.tscn 2>&1 | tee complete-library-test.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-plant-summoning-logs
          path: |
            plant-import.log
            plant-preparation-test.log
            plant-spell-detail-test.log
            sprout-test.log
            focus-grid-test.log
            ground-target-test.log
            complete-library-test.log
          if-no-files-found: ignore
