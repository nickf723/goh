name: Surf and Focus validation

on:
  push:
    branches:
      - main
    paths:
      - "scripts/player/player_surf_controller.gd"
      - "scripts/actions/surf_cast.gd"
      - "scripts/hazards/surface_hazard_area.gd"
      - "scripts/player/player_defense_controller_elemental.gd"
      - "scripts/abilities/ability_caster_focus_library.gd"
      - "scripts/input/player_control_router_focus_library.gd"
      - "scripts/ui/game_ui_spell_icons_resolved.gd"
      - "scripts/levels/prototype_surf_spell_trial.gd"
      - "scripts/tests/surf_spell_smoke_test.gd"
      - "scripts/tests/focus_quickbar_independence_smoke_test.gd"
      - "scripts/tests/focus_quickbar_icon_independence_smoke_test.gd"
      - "scenes/actions/surf_cast.tscn"
      - "scenes/actors/player/player.tscn"
      - "scenes/levels/prototypes/prototype_surf_spell_trial_v1.tscn"
      - "scenes/tests/surf_spell_smoke_test.tscn"
      - "scenes/tests/focus_quickbar_independence_smoke_test.tscn"
      - "scenes/tests/focus_quickbar_icon_independence_smoke_test.tscn"
      - "data/abilities/surf_ability.tres"
      - "data/loadouts/grace_starting_loadout.tres"
      - "docs/SURF_V1.md"
      - ".github/workflows/surf-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surf-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-surf:
    name: Import and Surf regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Show Godot version
        run: godot --version

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee surf-import.log

      - name: Boot the Riptide Causeway
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 3 res://scenes/levels/prototypes/prototype_surf_spell_trial_v1.tscn 2>&1 | tee surf-trial-boot.log

      - name: Run Surf movement and hazard regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/surf_spell_smoke_test.tscn 2>&1 | tee surf-test.log

      - name: Run Focus and quickbar independence regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/focus_quickbar_independence_smoke_test.tscn 2>&1 | tee focus-quickbar-test.log

      - name: Run Focus icon-row independence regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/focus_quickbar_icon_independence_smoke_test.tscn 2>&1 | tee focus-icon-test.log

      - name: Run permanent quickbar regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/quick_spell_belt_smoke_test.tscn 2>&1 | tee quickbar-test.log

      - name: Run spell capability regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/spell_capability_manifest_smoke_test.tscn 2>&1 | tee spell-capability-test.log

      - name: Run performance foundation regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/runtime_performance_foundation_smoke_test.tscn 2>&1 | tee performance-test.log

      - name: Run laboratory resource regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/lab_resource_regenerator_smoke_test.tscn 2>&1 | tee lab-resource-test.log

      - name: Upload Surf validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surf-validation-logs
          path: |
            surf-import.log
            surf-trial-boot.log
            surf-test.log
            focus-quickbar-test.log
            focus-icon-test.log
            quickbar-test.log
            spell-capability-test.log
            performance-test.log
            lab-resource-test.log
          if-no-files-found: ignore
