name: Godot validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Focused wilds expedition validation
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Run wilds expedition smoke test
        run: godot --headless --path . scenes/tests/wilds_expedition_smoke_test.tscn

      - name: Boot wilds expedition headlessly
        run: godot --headless --path . scenes/levels/prototypes/prototype_wilds_expedition_v1.tscn --quit-after 8

      - name: Boot combo arena regression
        run: godot --headless --path . scenes/levels/prototypes/prototype_weapon_combat_arena_v1.tscn --quit-after 4
