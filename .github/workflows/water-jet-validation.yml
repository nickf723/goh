name: Water Jet validation

on:
  push:
    branches:
      - main
    paths:
      - "scripts/actions/water_jet_cast.gd"
      - "scripts/actions/water_jet_cast_ready.gd"
      - "scripts/levels/prototype_water_jet_spell_trial.gd"
      - "scripts/tests/water_jet_spell_smoke_test.gd"
      - "scripts/tests/water_jet_trial_smoke_test.gd"
      - "scenes/actions/water_jet_cast.tscn"
      - "scenes/levels/prototypes/prototype_water_jet_spell_trial_v1.tscn"
      - "scenes/tests/water_jet_spell_smoke_test.tscn"
      - "scenes/tests/water_jet_trial_smoke_test.tscn"
      - "data/abilities/water_jet_ability.tres"
      - "data/damage_payloads/water_jet_payload.tres"
      - "docs/WATER_JET_V2.md"
      - ".github/workflows/water-jet-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: water-jet-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-water-jet:
    name: Import and Water Jet regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Show Godot version
        run: godot --version

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee water-jet-import.log

      - name: Boot the Pressureworks
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 3 res://scenes/levels/prototypes/prototype_water_jet_spell_trial_v1.tscn 2>&1 | tee water-jet-trial-boot.log

      - name: Run Water Jet pressure and recoil regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/water_jet_spell_smoke_test.tscn 2>&1 | tee water-jet-test.log

      - name: Run Pressureworks progression regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/water_jet_trial_smoke_test.tscn 2>&1 | tee water-jet-trial-test.log

      - name: Run Focus and quickbar independence regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/focus_quickbar_independence_smoke_test.tscn 2>&1 | tee focus-quickbar-test.log

      - name: Run Focus icon-row regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/focus_quickbar_icon_independence_smoke_test.tscn 2>&1 | tee focus-icon-test.log

      - name: Run permanent quickbar regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/quick_spell_belt_smoke_test.tscn 2>&1 | tee quickbar-test.log

      - name: Run spell capability regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/spell_capability_manifest_smoke_test.tscn 2>&1 | tee spell-capability-test.log

      - name: Run performance foundation regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/runtime_performance_foundation_smoke_test.tscn 2>&1 | tee performance-test.log

      - name: Run laboratory resource regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/lab_resource_regenerator_smoke_test.tscn 2>&1 | tee lab-resource-test.log

      - name: Upload Water Jet validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-jet-validation-logs
          path: |
            water-jet-import.log
            water-jet-trial-boot.log
            water-jet-test.log
            water-jet-trial-test.log
            focus-quickbar-test.log
            focus-icon-test.log
            quickbar-test.log
            spell-capability-test.log
            performance-test.log
            lab-resource-test.log
          if-no-files-found: ignore
