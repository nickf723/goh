name: Pine Ridge transition validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Test authored segments
        run: godot --headless --path . scenes/tests/authored_wilds_segments_smoke_test.tscn
      - name: Test route familiarity
        run: godot --headless --path . scenes/tests/route_familiarity_smoke_test.tscn
      - name: Boot Wilds expedition
        run: godot --headless --path . scenes/levels/prototypes/prototype_wilds_expedition_v1.tscn --quit-after 6
