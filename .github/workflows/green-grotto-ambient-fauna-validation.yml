name: Green Grotto Ambient Fauna

on:
  push:
    branches:
      - main
    paths:
      - "scripts/environment/green_grotto_fauna_visual.gd"
      - "scripts/environment/green_grotto_fauna_ambient_behavior.gd"
      - "scripts/levels/prototype_green_grotto_reflection_pass.gd"
      - "scripts/tests/green_grotto_fauna_ambient_behavior_smoke_test.gd"
      - "scenes/tests/green_grotto_fauna_ambient_behavior_smoke_test.tscn"
      - "scenes/levels/prototypes/prototype_green_grotto_art_target_v1.tscn"
      - "docs/GREEN_GROTTO_AMBIENT_FAUNA_V1.md"
      - ".github/workflows/green-grotto-ambient-fauna-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: green-grotto-ambient-fauna-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ambient-fauna:
    name: Import, ambient fauna contract, and Green boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee green-grotto-ambient-fauna-import.log

      - name: Run ambient fauna regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/green_grotto_fauna_ambient_behavior_smoke_test.tscn 2>&1 | tee green-grotto-ambient-fauna-test.log

      - name: Boot Green Grotto benchmark
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 8 res://scenes/levels/prototypes/prototype_green_grotto_art_target_v1.tscn 2>&1 | tee green-grotto-ambient-fauna-green-boot.log

      - name: Upload fauna logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: green-grotto-ambient-fauna-logs
          path: |
            green-grotto-ambient-fauna-import.log
            green-grotto-ambient-fauna-test.log
            green-grotto-ambient-fauna-green-boot.log
          if-no-files-found: ignore
