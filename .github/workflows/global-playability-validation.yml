name: Global playability framework validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
      - name: Validate capability inventory
        run: python scripts/ci/validate_capability_inventory.py
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Test global playability framework
        shell: bash
        run: |
          set +e
          timeout 45s godot --headless --path . scenes/tests/global_playability_framework_smoke_test.tscn > /tmp/global-playability.log 2>&1
          status=$?
          grep -E "GLOBAL_PLAYABILITY|SCRIPT ERROR|ERROR:|Invalid|FAIL|STALLED" /tmp/global-playability.log || true
          exit $status
      - name: Upload focused playability log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-playability-log
          path: /tmp/global-playability.log
          if-no-files-found: error
          retention-days: 1
      - name: Test Drowned Bell quest flow
        run: timeout 45s godot --headless --path . scenes/tests/drowned_bell_foundation_smoke_test.tscn
      - name: Test Broken Waystation consequences
        run: timeout 45s godot --headless --path . scenes/tests/broken_waystation_consequence_smoke_test.tscn
      - name: Test Ruined Village regression
        run: timeout 45s godot --headless --path . scenes/tests/ruined_village_approach_smoke_test.tscn
      - name: Boot Drowned Bell
        run: timeout 30s godot --headless --path . scenes/levels/prototypes/prototype_drowned_bell_v1.tscn --quit-after 5
      - name: Boot Broken Waystation
        run: timeout 30s godot --headless --path . scenes/levels/prototypes/prototype_broken_waystation_mission_v1.tscn --quit-after 5
