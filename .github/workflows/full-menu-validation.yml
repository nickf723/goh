name: Full menu validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-menu-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-menu:
    name: Import and full-menu regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Run Grace menu regression
        run: godot --headless --path . res://scenes/tests/full_menu_loadout_v1_smoke_test.tscn

      - name: Run Magic atlas regression
        run: godot --headless --path . res://scenes/tests/full_menu_magic_v1_smoke_test.tscn

      - name: Run refined Magic workspace regression
        run: godot --headless --path . res://scenes/tests/full_menu_magic_v2_smoke_test.tscn

      - name: Run divine Magic relationships regression
        run: godot --headless --path . res://scenes/tests/full_menu_magic_divine_smoke_test.tscn

      - name: Run structured Items workspace regression
        run: godot --headless --path . res://scenes/tests/full_menu_items_v1_smoke_test.tscn

      - name: Run learned Journal workspace regression
        run: godot --headless --path . res://scenes/tests/full_menu_journal_v1_smoke_test.tscn

      - name: Run pursuit Codex and elemental Journal regression
        run: godot --headless --path . res://scenes/tests/full_menu_codex_v1_smoke_test.tscn

      - name: Run progression backbone regression
        run: godot --headless --path . res://scenes/tests/progression_backbone_v1_smoke_test.tscn

      - name: Run progression rewards regression
        run: godot --headless --path . res://scenes/tests/progression_rewards_v1_smoke_test.tscn

      - name: Run progression challenge lab regression
        run: godot --headless --path . res://scenes/tests/progression_challenge_lab_smoke_test.tscn

      - name: Run progression feedback and tracking regression
        run: godot --headless --path . res://scenes/tests/progression_feedback_tracking_v1_smoke_test.tscn

      - name: Run Mob Engine Foundation regression
        run: godot --headless --path . res://scenes/tests/mob_engine_foundation_smoke_test.tscn

      - name: Run Mob drives and intentions regression
        run: godot --headless --path . res://scenes/tests/mob_drives_and_intentions_smoke_test.tscn

      - name: Run live Animal Behavior Lab regression
        run: godot --headless --path . res://scenes/tests/animal_behavior_lab_smoke_test.tscn

      - name: Run animal perception and relationship regression
        run: godot --headless --path . res://scenes/tests/animal_perception_relationship_smoke_test.tscn

      - name: Run animal bonding and persistence regression
        run: godot --headless --path . res://scenes/tests/animal_bonding_persistence_smoke_test.tscn

      - name: Run wildlife navigation and rescue regression
        run: godot --headless --path . res://scenes/tests/wildlife_navigation_rescue_lab_smoke_test.tscn

      - name: Run companion command authority regression
        run: godot --headless --path . res://scenes/tests/companion_command_authority_smoke_test.tscn

      - name: Run summon-driven familiar command interface regression
        run: godot --headless --path . res://scenes/tests/familiar_command_interface_smoke_test.tscn

      - name: Run persistent ability context provider regression
        run: godot --headless --path . res://scenes/tests/persistent_ability_context_providers_smoke_test.tscn

      - name: Run active ability ribbon and spell icon regression
        run: godot --headless --path . res://scenes/tests/active_ability_ribbon_spell_icons_smoke_test.tscn

      - name: Run unified HUD shell regression
        run: godot --headless --path . res://scenes/tests/unified_hud_shell_smoke_test.tscn

      - name: Run base Ruined Village regression
        run: godot --headless --path . res://scenes/tests/ruined_village_approach_smoke_test.tscn

      - name: Run Ruined Village field progression regression
        run: godot --headless --path . res://scenes/tests/ruined_village_field_progression_smoke_test.tscn

      - name: Run recorded objects regression
        run: godot --headless --path . res://scenes/tests/recorded_objects_v1_smoke_test.tscn

      - name: Run recorded object production integration regression
        run: godot --headless --path . res://scenes/tests/recorded_objects_production_integration_smoke_test.tscn

      - name: Run recorded object interoperability regression
        run: godot --headless --path . res://scenes/tests/recorded_object_interoperability_smoke_test.tscn

      - name: Run recorded object spell and context regression
        run: godot --headless --path . res://scenes/tests/recorded_object_spell_context_smoke_test.tscn

      - name: Run engineering builds regression
        run: godot --headless --path . res://scenes/tests/engineering_builds_v1_smoke_test.tscn

      - name: Run Artificer Construction regression
        run: godot --headless --path . res://scenes/tests/artificer_construction_v1_smoke_test.tscn

      - name: Run placement input isolation regression
        run: godot --headless --path . res://scenes/tests/placement_input_isolation_smoke_test.tscn

      - name: Run death and mixed-save recovery regression
        run: godot --headless --path . res://scenes/tests/death_save_recovery_smoke_test.tscn

      - name: Run freed-control navigation regression
