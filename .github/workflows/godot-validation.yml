name: Godot validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: route-familiarity-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Focused route familiarity final validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Run route familiarity smoke test
        run: godot --headless --path . res://scenes/tests/route_familiarity_smoke_test.tscn

      - name: Capture regional map persistence regression
        id: regional
        continue-on-error: true
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/goh-regional-map-pass.txt" "$RUNNER_TEMP/goh-regional-map-checkpoint.txt"
          set +e
          set +o pipefail
          timeout 30s godot --headless --path . res://scenes/tests/regional_expedition_map_smoke_test.tscn
          set -o pipefail
          checkpoint="$(cat "$RUNNER_TEMP/goh-regional-map-checkpoint.txt" 2>/dev/null || echo missing)"
          echo "checkpoint=$checkpoint" >> "$GITHUB_OUTPUT"
          if test -f "$RUNNER_TEMP/goh-regional-map-pass.txt"; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Checkpoint complete
        if: steps.regional.outputs.checkpoint == 'complete'
        run: echo "Regional map regression reached completion."

      - name: Checkpoint returned map ready
        if: steps.regional.outputs.checkpoint == 'returned map ready'
        run: echo "Regional map regression stopped after returned map setup."

      - name: Checkpoint persistence simulated
        if: steps.regional.outputs.checkpoint == 'persistence simulated'
        run: echo "Regional map regression stopped after persistence simulation."

      - name: Checkpoint outbound context valid
        if: steps.regional.outputs.checkpoint == 'outbound context valid'
        run: echo "Regional map regression stopped after outbound context."

      - name: Checkpoint initial map ready
        if: steps.regional.outputs.checkpoint == 'initial map ready'
        run: echo "Regional map regression stopped after initial map setup."

      - name: Checkpoint starting or missing
        if: steps.regional.outputs.checkpoint == 'starting' || steps.regional.outputs.checkpoint == 'missing'
        run: echo "Regional map regression stopped during startup."

      - name: Verify regional map persistence regression
        run: test "${{ steps.regional.outputs.passed }}" = "true"

      - name: Run Wilds generation regression
        run: godot --headless --path . res://scenes/tests/wilds_expedition_smoke_test.tscn

      - name: Boot regional expedition map
        run: godot --headless --path . res://scenes/levels/prototypes/prototype_regional_expedition_map_v1.tscn --quit-after 4

      - name: Boot Wilds expedition
        run: godot --headless --path . res://scenes/levels/prototypes/prototype_wilds_expedition_v1.tscn --quit-after 4

      - name: Boot combo arena regression
        run: godot --headless --path . res://scenes/levels/prototypes/prototype_weapon_combat_arena_v1.tscn --quit-after 4
