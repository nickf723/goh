name: Lightning Spark validation

on:
  push:
    branches:
      - main
    paths:
      - "scripts/actions/lightning_spark_burst.gd"
      - "scripts/actions/lightning_spark_burst_upgraded.gd"
      - "scripts/input/controller_haptic_pattern.gd"
      - "scripts/levels/prototype_lightning_spark_spell_trial.gd"
      - "scripts/levels/prototype_lightning_spark_spell_trial_playable.gd"
      - "scripts/tests/lightning_spark_forked_conduit_smoke_test.gd"
      - "scripts/tests/lightning_spark_chain_upgrade_smoke_test.gd"
      - "scenes/actions/lightning_spark_burst.tscn"
      - "scenes/levels/prototypes/prototype_lightning_spark_spell_trial_v1.tscn"
      - "scenes/tests/lightning_spark_forked_conduit_smoke_test.tscn"
      - "scenes/tests/lightning_spark_chain_upgrade_smoke_test.tscn"
      - "data/abilities/lightning_spark_ability.tres"
      - "data/damage_payloads/lightning_spark_payload.tres"
      - "docs/LIGHTNING_SPARK_V2.md"
      - ".github/workflows/lightning-spark-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightning-spark-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-lightning-spark:
    name: Import and Lightning Spark regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Show Godot version
        run: godot --version

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee lightning-spark-import.log

      - name: Boot the Forked Conduit trial
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 3 res://scenes/levels/prototypes/prototype_lightning_spark_spell_trial_v1.tscn 2>&1 | tee lightning-spark-trial-boot.log

      - name: Run Lightning Spark cone and haptic regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/lightning_spark_forked_conduit_smoke_test.tscn 2>&1 | tee lightning-spark-test.log

      - name: Run Chain Lightning cone compatibility regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/lightning_spark_chain_upgrade_smoke_test.tscn 2>&1 | tee lightning-spark-chain-test.log

      - name: Run spell capability architecture regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/spell_capability_manifest_smoke_test.tscn 2>&1 | tee spell-capability-test.log

      - name: Run laboratory resource regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/lab_resource_regenerator_smoke_test.tscn 2>&1 | tee lab-resource-test.log

      - name: Upload Lightning Spark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightning-spark-validation-logs
          path: |
            lightning-spark-import.log
            lightning-spark-trial-boot.log
            lightning-spark-test.log
            lightning-spark-chain-test.log
            spell-capability-test.log
            lab-resource-test.log
          if-no-files-found: ignore
