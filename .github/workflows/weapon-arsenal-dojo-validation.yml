      - "scripts/tests/*weapon*.gd"
      - "scripts/tests/grace_combat_feel_pass_01_smoke_test.gd"
      - "scripts/tests/grace_skeletal_grounding_smoke_test.gd"
      - "scripts/tests/grace_production_presentation_smoke_test.gd"
      - "scenes/actors/player/player_combat_v2.tscn"
      - "scenes/actors/player/grace_humanoid_skeletal_proxy_v*.tscn"
      - "scenes/actors/player/grace_production_presentation_controller.tscn"
      - "scenes/actors/testing/combat_training_target_engaged.tscn"
      - "scenes/weapons/**"
      - "scenes/levels/prototypes/prototype_weapon_arsenal_dojo_v1.tscn"
      - "scenes/tests/*weapon*.tscn"
      - "scenes/tests/grace_combat_feel_pass_01_smoke_test.tscn"
      - "scenes/tests/grace_skeletal_grounding_smoke_test.tscn"
      - "scenes/tests/grace_production_presentation_smoke_test.tscn"
      - "docs/WEAPON_ARSENAL_DOJO_V0_1.md"
      - "docs/WEAPON_COMBAT_IDENTITY_V0_2.md"
      - "docs/FLEXIBLE_WEAPON_COMBAT_V0_3.md"
      - "docs/GRACE_COMBAT_FEEL_PASS_01.md"
      - "docs/GRACE_SKELETAL_ANIMATION_PIPELINE_V1.md"
      - "docs/GRACE_HUMANOID_IMPORT_CONTRACT_V1.md"
      - "docs/GRACE_PRODUCTION_PRESENTATION_PIPELINE_V1.md"
      - "docs/GRACE_0_5_MODEL_BRIEF_V1.md"
      - "docs/SWORD_COMBAT_LANGUAGE_V0_3.md"
      - "docs/WEAPON_LANGUAGE_DIVERSIFICATION_V0_4.md"
      - "docs/WEAPON_MOVESET_COMPLETION_CONTRACT_V1.md"
      - ".github/workflows/weapon-arsenal-dojo-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weapon-arsenal-dojo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-arsenal-dojo:
    name: Import, complete weapon coverage, production presentation, and dojo boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee arsenal-dojo-import.log

      - name: Run context Light Heavy technique regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/context_weapon_technique_smoke_test.tscn --quit-after 8 2>&1 | tee context-technique-test.log

      - name: Run canonical weapon moveset and language regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/weapon_moveset_smoke_test.tscn 2>&1 | tee weapon-moveset-test.log

      - name: Run weapon charge grammar regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/weapon_charge_grammar_smoke_test.tscn 2>&1 | tee weapon-charge-test.log

      - name: Run complete axe moveset regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/axe_weapon_focus_smoke_test.tscn 2>&1 | tee axe-weapon-focus-test.log

      - name: Run skeletal Grace grounding and weapon-language regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/grace_skeletal_grounding_smoke_test.tscn 2>&1 | tee grace-skeletal-grounding-test.log

      - name: Run Grace production presentation regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/grace_production_presentation_smoke_test.tscn 2>&1 | tee grace-production-presentation-test.log

      - name: Run arsenal dojo regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/weapon_arsenal_dojo_smoke_test.tscn 2>&1 | tee arsenal-dojo-test.log

      - name: Run flexible weapon combat regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/flexible_weapon_combat_v2_smoke_test.tscn 2>&1 | tee flexible-weapon-v2-test.log

      - name: Run Grace combat feel and skeletal animation regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/grace_combat_feel_pass_01_smoke_test.tscn 2>&1 | tee grace-combat-feel-test.log

      - name: Boot arsenal dojo
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 8 res://scenes/levels/prototypes/prototype_weapon_arsenal_dojo_v1.tscn 2>&1 | tee arsenal-dojo-boot.log

      - name: Upload arsenal dojo logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weapon-arsenal-dojo-logs
          path: |
            arsenal-dojo-import.log
            context-technique-test.log
            weapon-moveset-test.log
            weapon-charge-test.log
            axe-weapon-focus-test.log
            grace-skeletal-grounding-test.log
            grace-production-presentation-test.log
            arsenal-dojo-test.log
            flexible-weapon-v2-test.log
            grace-combat-feel-test.log
            arsenal-dojo-boot.log
          if-no-files-found: ignore
