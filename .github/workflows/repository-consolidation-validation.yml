name: Repository consolidation validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate capability inventory
        run: python scripts/ci/validate_capability_inventory.py
      - name: Verify consolidation documents
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path('docs/REPOSITORY_AUDIT.md'),
              Path('docs/CONSOLIDATION_BACKLOG.md'),
              Path('AGENTS.md'),
          ]
          for path in required:
              assert path.is_file(), f'missing {path}'

          agents = Path('AGENTS.md').read_text(encoding='utf-8')
          audit = Path('docs/REPOSITORY_AUDIT.md').read_text(encoding='utf-8')
          assert 'capability_inventory.json' in agents, 'AGENTS.md does not reference capability inventory'
          assert 'do_not_resuggest' in audit, 'repository audit does not define resuggestion policy'
          print('CONSOLIDATION_DOCUMENTS: PASS')
          PY
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
      - name: Import project
        run: godot --headless --path . --editor --quit
