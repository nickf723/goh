name: Drowned Bell foundation validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
      - name: Test Drowned Bell foundation
        shell: bash
        run: |
          set +e
          godot --headless --path . scenes/tests/drowned_bell_foundation_smoke_test.tscn > /tmp/drowned-bell-test.log 2>&1
          status=$?
          echo "===== DROWNED BELL DIAGNOSTICS ====="
          grep -E "DROWNED_BELL|SCRIPT ERROR|ERROR:|Invalid|stalled during" /tmp/drowned-bell-test.log || true
          exit $status
