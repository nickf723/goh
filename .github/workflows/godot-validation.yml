name: Godot validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Registry, import, startup, and Windows export
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate custom agent profiles
        run: python scripts/ci/validate_agent_profiles.py

      - name: Validate feature registry
        run: python scripts/ci/validate_feature_registry.py

      - name: Install Godot 4.6 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: true

      - name: Show Godot version
        run: godot --version

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Start project headlessly
        run: godot --headless --path . --quit-after 5

      - name: Run registered feature scenes and tests
        run: python scripts/ci/run_feature_registry.py --godot godot

      - name: Export Windows v0.1 build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/GraceOfHumanity-v0.1.0.exe
          test -f build/windows/GraceOfHumanity-v0.1.0.exe

      - name: Upload Windows v0.1 artifact (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: GraceOfHumanity-v0.1.0-windows
          path: build/windows
          if-no-files-found: error
          retention-days: 3

  # Temporary focused diagnostics for the combo laboratory PR.
  combo-lab-final:
    name: Combo laboratory final checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Boot combat combo laboratory
        run: godot --headless --path . res://scenes/levels/prototypes/prototype_weapon_combat_arena_v1.tscn --quit-after 7

      - name: Capture registered weapon and sandbox suite
        continue-on-error: true
        run: godot --headless --path . res://scenes/tests/weapon_moveset_smoke_test.tscn > registered-suite.log 2>&1

      - name: Upload registered suite log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: registered-suite-log
          path: registered-suite.log
          if-no-files-found: error
          retention-days: 1

      - name: Require registered suite pass
        if: always()
        run: grep -q "WEAPON_MOVESET_SMOKE_TEST: PASS" registered-suite.log
