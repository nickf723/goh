name: Godot validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Focused regional expedition map validation
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Run regional expedition map smoke test
        run: godot --headless --path . scenes/tests/regional_expedition_map_smoke_test.tscn

      - name: Boot regional expedition map
        run: godot --headless --path . scenes/levels/prototypes/prototype_regional_expedition_map_v1.tscn --quit-after 5

      - name: Boot Wilds expedition regression
        run: godot --headless --path . scenes/levels/prototypes/prototype_wilds_expedition_v1.tscn --quit-after 5

      - name: Run Wilds expedition regression test
        run: godot --headless --path . scenes/tests/wilds_expedition_smoke_test.tscn
