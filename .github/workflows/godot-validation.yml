name: Godot validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Import, startup, and Windows export
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate custom agent profiles
        run: python scripts/ci/validate_agent_profiles.py

      - name: Install Godot 4.6 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: true

      - name: Show Godot version
        run: godot --version

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Start project headlessly
        run: godot --headless --path . --quit-after 5

      - name: Start Church Trial headlessly
        run: godot --headless --path . res://scenes/levels/prototypes/prototype_boss_dungeon_chain_v1.tscn --quit-after 5

      - name: Start Elemental Reaction Lab headlessly
        run: godot --headless --path . res://scenes/levels/prototypes/prototype_elemental_reaction_lab_v1.tscn --quit-after 5

      - name: Validate elemental reaction recipes
        run: godot --headless --path . res://scenes/tests/elemental_reaction_smoke_test.tscn

      - name: Start Weapon Combat Arena headlessly
        run: godot --headless --path . res://scenes/levels/prototypes/prototype_weapon_combat_arena_v1.tscn --quit-after 5

      - name: Validate weapon moveset graphs
        run: godot --headless --path . res://scenes/tests/weapon_moveset_smoke_test.tscn

      - name: Start Runtime Stat Laboratory headlessly
        run: godot --headless --path . res://scenes/levels/prototypes/prototype_runtime_stat_lab_v1.tscn --quit-after 5

      - name: Validate runtime stat session
        run: godot --headless --path . res://scenes/tests/runtime_stat_lab_smoke_test.tscn

      - name: Export Windows v0.1 build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/GraceOfHumanity-v0.1.0.exe
          test -f build/windows/GraceOfHumanity-v0.1.0.exe

      - name: Upload Windows v0.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GraceOfHumanity-v0.1.0-windows
          path: build/windows
          if-no-files-found: error
          retention-days: 14
