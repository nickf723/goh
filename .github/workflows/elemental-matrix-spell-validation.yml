name: Elemental Matrix Spells

on:
  push:
    branches:
      - main
    paths:
      - "scripts/actions/**"
      - "scripts/abilities/ability_loadout.gd"
      - "scripts/abilities/ability_caster_matrix_library.gd"
      - "scripts/combat/authority_status_receiver_base.gd"
      - "scripts/systems/reaction_state_policy.gd"
      - "scripts/combat/force_receiver.gd"
      - "scripts/surfaces/status_surface.gd"
      - "data/abilities/**"
      - "scenes/actions/**"
      - "scripts/tests/elemental_matrix_spell_batch_smoke_test.gd"
      - "scenes/tests/elemental_matrix_spell_batch_smoke_test.tscn"
      - "scenes/actors/player/player_combat_v2.tscn"
      - ".github/workflows/elemental-matrix-spell-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elemental-matrix-spells-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-matrix-spells:
    name: Import and validate Elemental Matrix spell batch
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee elemental-matrix-import.log

      - name: Run Elemental Matrix spell regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/elemental_matrix_spell_batch_smoke_test.tscn 2>&1 | tee elemental-matrix-spells.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elemental-matrix-spell-logs
          path: |
            elemental-matrix-import.log
            elemental-matrix-spells.log
          if-no-files-found: ignore
