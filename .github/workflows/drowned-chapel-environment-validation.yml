name: Drowned Chapel environment validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
      - name: Validate capability inventory
        run: python scripts/ci/validate_capability_inventory.py
      - name: Validate feature registry
        run: python scripts/ci/validate_feature_registry.py
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Test authored chapel environment
        run: timeout 60s godot --headless --path . scenes/tests/drowned_bell_environment_smoke_test.tscn
      - name: Test global playability
        run: timeout 45s godot --headless --path . scenes/tests/global_playability_framework_smoke_test.tscn
      - name: Test Drowned Bell quest flow
        run: timeout 45s godot --headless --path . scenes/tests/drowned_bell_foundation_smoke_test.tscn
      - name: Test Broken Waystation consequences
        run: timeout 45s godot --headless --path . scenes/tests/broken_waystation_consequence_smoke_test.tscn
      - name: Test Ruined Village regression
        run: timeout 45s godot --headless --path . scenes/tests/ruined_village_approach_smoke_test.tscn
      - name: Boot Drowned Bell
        run: timeout 30s godot --headless --path . scenes/levels/prototypes/prototype_drowned_bell_v1.tscn --quit-after 5
