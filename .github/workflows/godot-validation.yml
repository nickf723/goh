name: Godot validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Registry, import, startup, and Windows export
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate custom agent profiles
        run: python scripts/ci/validate_agent_profiles.py

      - name: Validate feature registry
        run: python scripts/ci/validate_feature_registry.py

      - name: Validate capability inventory
        run: python scripts/ci/validate_capability_inventory.py

      - name: Install Godot 4.6 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: true

      - name: Show Godot version
        run: godot --version

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Start project headlessly
        run: godot --headless --path . --quit-after 5

      - name: Run registered feature scenes and tests
        run: python scripts/ci/run_feature_registry.py --godot godot

      - name: Run player records and species persistence test
        run: godot --headless --path . res://scenes/tests/species_knowledge_smoke_test.tscn

      - name: Run Creature Mastery familiar test
        run: godot --headless --path . res://scenes/tests/creature_mastery_familiar_smoke_test.tscn

      - name: Run familiar swapping grounding and aim test
        run: godot --headless --path . res://scenes/tests/familiar_polish_smoke_test.tscn

      - name: Run summon-driven familiar command interface test
        run: godot --headless --path . res://scenes/tests/familiar_command_interface_smoke_test.tscn

      - name: Run live creature observation test
        run: godot --headless --path . res://scenes/tests/creature_observation_smoke_test.tscn

      - name: Run spellcasting mastery and achievement test
        run: godot --headless --path . res://scenes/tests/spellcasting_mastery_smoke_test.tscn

      - name: Run player preferences and accessibility test
        run: godot --headless --path . res://scenes/tests/player_preferences_smoke_test.tscn

      - name: Run Grace wire motion rig test
        run: godot --headless --path . res://scenes/tests/grace_animation_smoke_test.tscn

      - name: Run Grace ground motion motor test
        run: godot --headless --path . res://scenes/tests/ground_motion_motor_smoke_test.tscn

      - name: Run continuous stair traversal test
        run: godot --headless --path . res://scenes/tests/stair_traversal_smoke_test.tscn

      - name: Run Grace dodge motion and recovery test
        run: godot --headless --path . res://scenes/tests/dodge_motion_smoke_test.tscn

      - name: Run Grace combat footwork test
        run: godot --headless --path . res://scenes/tests/combat_footwork_smoke_test.tscn

      - name: Run Grace vertical motion continuity test
        run: godot --headless --path . res://scenes/tests/vertical_motion_smoke_test.tscn

      - name: Run Divine Incarnation avatar proxy test
        run: godot --headless --path . res://scenes/tests/avatar_incarnation_smoke_test.tscn

      - name: Run Ruvia halberd combat language test
        run: godot --headless --path . res://scenes/tests/ruvia_halberd_combat_smoke_test.tscn

      - name: Run Ruvia Fire specialist mechanics test
        run: godot --headless --path . res://scenes/tests/ruvia_fire_specialist_smoke_test.tscn

      - name: Run avatar control driver and manifestation test
        run: godot --headless --path . res://scenes/tests/avatar_control_driver_manifestation_smoke_test.tscn

      - name: Run Divine Specials charge and Ruvia effects test
        run: godot --headless --path . res://scenes/tests/divine_specials_smoke_test.tscn

      - name: Run Divine Special controller input and radial test
        run: godot --headless --path . res://scenes/tests/divine_special_input_smoke_test.tscn

      - name: Run Focus and Divine selection quirks test
        run: godot --headless --path . res://scenes/tests/controller_selection_quirks_smoke_test.tscn

      - name: Run ten-slot quick spell belt test
        run: godot --headless --path . res://scenes/tests/quick_spell_belt_smoke_test.tscn

      - name: Run Grace menu geometry and right-stick test
        run: godot --headless --path . res://scenes/tests/full_menu_loadout_v1_smoke_test.tscn

      - name: Run scroll-free Magic atlas test
        run: godot --headless --path . res://scenes/tests/full_menu_magic_v1_smoke_test.tscn

      - name: Run AoE targeting and Focus UI performance test
        run: godot --headless --path . res://scenes/tests/ground_target_focus_ui_smoke_test.tscn

      - name: Run spell targeting profile and preview test
        run: godot --headless --path . res://scenes/tests/spell_targeting_profile_smoke_test.tscn

      - name: Run reaction lab playability test
        run: godot --headless --path . res://scenes/tests/reaction_lab_playability_smoke_test.tscn

      - name: Run elemental chemistry transaction test
        run: godot --headless --path . res://scenes/tests/elemental_chemistry_engine_smoke_test.tscn

      - name: Run spell capability manifest and interaction recipes test
        run: godot --headless --path . res://scenes/tests/spell_capability_manifest_smoke_test.tscn

      - name: Run reaction-aware tactical AI test
        run: godot --headless --path . res://scenes/tests/reaction_tactical_ai_smoke_test.tscn

      - name: Run squad tactical coordination test
        run: godot --headless --path . res://scenes/tests/squad_tactical_coordination_smoke_test.tscn

      - name: Run squad tactical pairing test
        run: godot --headless --path . res://scenes/tests/squad_tactical_pairing_smoke_test.tscn

      - name: Run tactical AI lab replay test
        run: godot --headless --path . res://scenes/tests/tactical_ai_lab_replay_smoke_test.tscn

      - name: Run squad role archetype test
        run: godot --headless --path . res://scenes/tests/squad_role_archetype_smoke_test.tscn

      - name: Run Storm Drain Pack encounter test
        run: godot --headless --path . res://scenes/tests/storm_drain_pack_encounter_smoke_test.tscn

      - name: Run multi-target allocation test
        run: godot --headless --path . res://scenes/tests/multi_target_allocation_smoke_test.tscn

      - name: Run Storm Drain AI performance test
        run: godot --headless --path . res://scenes/tests/storm_drain_ai_performance_smoke_test.tscn

      - name: Run tactical AI Control Center test
        run: godot --headless --path . res://scenes/tests/tactical_ai_control_center_smoke_test.tscn

      - name: Run portrait-driven player HUD v2 test
        run: godot --headless --path . res://scenes/tests/player_hud_v2_smoke_test.tscn

      - name: Run compact HUD posture and targeting test
        run: godot --headless --path . res://scenes/tests/hud_posture_targeting_smoke_test.tscn

      - name: Run showcase mana recovery test
        run: godot --headless --path . res://scenes/tests/showcase_mana_recovery_smoke_test.tscn

      - name: Export Windows v0.1 build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/GraceOfHumanity-v0.1.0.exe
          test -f build/windows/GraceOfHumanity-v0.1.0.exe

      - name: Upload Windows v0.1 artifact (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: GraceOfHumanity-v0.1.0-windows
          path: build/windows
          if-no-files-found: error
          retention-days: 3
