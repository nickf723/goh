name: Crypt layout type fix validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Test Drowned Bell environment and composed passage
        run: timeout 75s godot --headless --path . scenes/tests/drowned_bell_environment_smoke_test.tscn
      - name: Test Drowned Bell crypt flow
        run: timeout 90s godot --headless --path . scenes/tests/drowned_bell_crypt_smoke_test.tscn
      - name: Boot Drowned Bell scene
        run: timeout 35s godot --headless --path . scenes/levels/prototypes/prototype_drowned_bell_v1.tscn --quit-after 7
