name: Weapon Arsenal Dojo

on:
  push:
    branches:
      - main
    paths:
      - "scripts/weapons/weapon_class_motion_catalog.gd"
      - "scripts/weapons/weapon_class_combat_identity.gd"
      - "scripts/weapons/weapon_pose_catalog_router.gd"
      - "scripts/weapons/safe_weapon_controller.gd"
      - "scripts/weapons/weapon_sandbox_catalog.gd"
      - "scripts/weapons/training_proxy_weapon_rig.gd"
      - "scripts/interaction/sandbox_weapon_pedestal.gd"
      - "scripts/levels/prototype_weapon_arsenal_dojo.gd"
      - "scripts/tests/weapon_arsenal_dojo_smoke_test.gd"
      - "scenes/weapons/training_proxy_weapon_rig.tscn"
      - "scenes/levels/prototypes/prototype_weapon_arsenal_dojo_v1.tscn"
      - "scenes/tests/weapon_arsenal_dojo_smoke_test.tscn"
      - "docs/WEAPON_ARSENAL_DOJO_V0_1.md"
      - "docs/WEAPON_COMBAT_IDENTITY_V0_2.md"
      - ".github/workflows/weapon-arsenal-dojo-validation.yml"
  pull_request:
    paths:
      - "scripts/weapons/**"
      - "scripts/interaction/sandbox_weapon_pedestal.gd"
      - "scripts/levels/prototype_weapon_arsenal_dojo.gd"
      - "scripts/tests/weapon_arsenal_dojo_smoke_test.gd"
      - "scenes/weapons/training_proxy_weapon_rig.tscn"
      - "scenes/levels/prototypes/prototype_weapon_arsenal_dojo_v1.tscn"
      - "scenes/tests/weapon_arsenal_dojo_smoke_test.tscn"
      - "docs/WEAPON_ARSENAL_DOJO_V0_1.md"
      - "docs/WEAPON_COMBAT_IDENTITY_V0_2.md"
      - ".github/workflows/weapon-arsenal-dojo-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weapon-arsenal-dojo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-arsenal-dojo:
    name: Import, combat identity regression, and dojo boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee arsenal-dojo-import.log

      - name: Run arsenal dojo regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/weapon_arsenal_dojo_smoke_test.tscn 2>&1 | tee arsenal-dojo-test.log

      - name: Boot arsenal dojo
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 8 res://scenes/levels/prototypes/prototype_weapon_arsenal_dojo_v1.tscn 2>&1 | tee arsenal-dojo-boot.log

      - name: Upload arsenal dojo logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weapon-arsenal-dojo-logs
          path: |
            arsenal-dojo-import.log
            arsenal-dojo-test.log
            arsenal-dojo-boot.log
          if-no-files-found: ignore
