name: Presentation Polish

on:
  push:
    branches:
      - main
    paths:
      - "scripts/presentation/**"
      - "scripts/systems/game_feedback.gd"
      - "scripts/components/hit_reaction_controller.gd"
      - "scripts/combat/combat_feedback.gd"
      - "scripts/combat/force_receiver.gd"
      - "scripts/combat/payload_receiver.gd"
      - "scripts/visuals/player_motion_feedback.gd"
      - "scripts/visuals/weapon_motion_audio_presenter.gd"
      - "scripts/visuals/enemy_visual_shell.gd"
      - "scripts/visuals/enemy_reaction_presentation_bridge.gd"
      - "scripts/ui/player_hud_adaptive_quiet.gd"
      - "scripts/interaction/breakable_prop.gd"
      - "scripts/enemies/enemy_actor.gd"
      - "scripts/enemies/hit_reaction_test_target.gd"
      - "scripts/abilities/ability_caster_spell_presentation.gd"
      - "scripts/abilities/ability_caster_focus_library.gd"
      - "scripts/actions/life_vine_grapple_targeted.gd"
      - "scripts/actions/death_hex_projectile.gd"
      - "scripts/actions/death_hex_curse_presented.gd"
      - "scripts/actions/death_wraith_projectile_presented.gd"
      - "scripts/actions/death_pursuer_spirit_presented.gd"
      - "scripts/levels/prototype_polish_studio.gd"
      - "scripts/levels/prototype_polish_studio_spells.gd"
      - "scripts/tests/presentation_director_smoke_test.gd"
      - "scripts/tests/presentation_audio_fidelity_v2_smoke_test.gd"
      - "scripts/tests/player_hud_adaptive_quiet_smoke_test.gd"
      - "scripts/tests/spell_presentation_lifecycle_smoke_test.gd"
      - "scripts/tests/hit_reaction_smoke_test.gd"
      - "scenes/actors/player/player_combat_v2.tscn"
      - "scenes/actors/enemies/goblin_drone.tscn"
      - "scenes/actors/enemies/goblin_visual_v1.tscn"
      - "scenes/actors/enemies/gremlin_visual_v1.tscn"
      - "scenes/actions/death_hex_curse.tscn"
      - "scenes/actions/death_wraith_projectile.tscn"
      - "scenes/actions/death_pursuer_spirit.tscn"
      - "scenes/levels/prototypes/prototype_polish_studio_v1.tscn"
      - "scenes/tests/presentation_director_smoke_test.tscn"
      - "scenes/tests/presentation_audio_fidelity_v2_smoke_test.tscn"
      - "scenes/tests/player_hud_adaptive_quiet_smoke_test.tscn"
      - "scenes/tests/spell_presentation_lifecycle_smoke_test.tscn"
      - "scenes/tests/hit_reaction_smoke_test.tscn"
      - "docs/HIT_REACTIONS_V1.md"
      - "docs/PRESENTATION_AUDIO_FIDELITY_V2.md"
      - ".github/workflows/presentation-polish-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-presentation:
    name: Import, audio, adaptive HUD, spell lifecycle, studio boot, movement, and reactions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee presentation-import.log

      - name: Run Presentation Director regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/presentation_director_smoke_test.tscn 2>&1 | tee presentation-director-test.log

      - name: Run presentation audio fidelity regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/presentation_audio_fidelity_v2_smoke_test.tscn 2>&1 | tee presentation-audio-fidelity-test.log

      - name: Run adaptive quiet HUD regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/player_hud_adaptive_quiet_smoke_test.tscn 2>&1 | tee adaptive-hud-test.log

      - name: Run spell lifecycle regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/spell_presentation_lifecycle_smoke_test.tscn 2>&1 | tee spell-lifecycle-test.log

      - name: Boot Polish Studio
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 res://scenes/levels/prototypes/prototype_polish_studio_v1.tscn 2>&1 | tee polish-studio-boot.log

      - name: Run hit-reaction regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/hit_reaction_smoke_test.tscn 2>&1 | tee hit-reaction-test.log

      - name: Run Grace animation regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/grace_animation_smoke_test.tscn 2>&1 | tee grace-animation-test.log

      - name: Upload presentation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-polish-logs
          path: |
            presentation-import.log
            presentation-director-test.log
            presentation-audio-fidelity-test.log
            adaptive-hud-test.log
            spell-lifecycle-test.log
            polish-studio-boot.log
            hit-reaction-test.log
            grace-animation-test.log
          if-no-files-found: ignore
