name: Combo lab diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combo-lab-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-combo-lab:
    name: Arena boot and weapon smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Boot combat combo laboratory
        run: godot --headless --path . res://scenes/levels/prototypes/prototype_weapon_combat_arena_v1.tscn --quit-after 7

      - name: Validate core weapon tests
        run: godot --headless --path . res://scenes/tests/weapon_moveset_core_diagnostic.tscn

      - name: Validate sandbox grants
        run: godot --headless --path . res://scenes/tests/combat_arena_sandbox_diagnostic.tscn -- apply

      - name: Validate sandbox restoration
        run: godot --headless --path . res://scenes/tests/combat_arena_sandbox_diagnostic.tscn -- restore

      - name: Capture weapon and sandbox smoke test
        continue-on-error: true
        run: godot --headless --path . res://scenes/tests/weapon_moveset_smoke_test.tscn > weapon-smoke.log 2>&1

      - name: Upload weapon smoke log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weapon-smoke-log
          path: weapon-smoke.log
          if-no-files-found: error
          retention-days: 1

      - name: Require weapon smoke pass
        if: always()
        run: grep -q "WEAPON_MOVESET_SMOKE_TEST: PASS" weapon-smoke.log
