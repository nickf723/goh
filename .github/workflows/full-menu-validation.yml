      - name: Run targeted projectile hand-origin regression
        run: godot --headless --path . res://scenes/tests/targeted_projectile_hand_origin_smoke_test.tscn

      - name: Run attack camera decoupling regression
        run: godot --headless --path . res://scenes/tests/attack_camera_decoupling_smoke_test.tscn
