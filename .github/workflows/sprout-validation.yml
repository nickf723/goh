name: Life Sprout

on:
  push:
    branches:
      - main
    paths:
      - "scripts/actions/life_sprout_platform.gd"
      - "scripts/ui/game_ui_focus_minimal.gd"
      - "scripts/input/player_control_router_focus_grid.gd"
      - "scripts/tests/sprout_smoke_test.gd"
      - "scripts/tests/compact_focus_menu_smoke_test.gd"
      - "scenes/actions/life_sprout_platform.tscn"
      - "scenes/tests/sprout_smoke_test.tscn"
      - "data/abilities/sprout_ability.tres"
      - "data/loadouts/grace_starting_loadout.tres"
      - ".github/workflows/sprout-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: life-sprout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-sprout:
    name: Import, temporary platform, and Focus navigation
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee sprout-import.log

      - name: Run Sprout regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/sprout_smoke_test.tscn 2>&1 | tee sprout-test.log

      - name: Run Focus first-render and navigation regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/compact_focus_menu_smoke_test.tscn 2>&1 | tee focus-grid-test.log

      - name: Run complete Focus library regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/complete_spell_library_smoke_test.tscn 2>&1 | tee complete-library-test.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-sprout-logs
          path: |
            sprout-import.log
            sprout-test.log
            focus-grid-test.log
            complete-library-test.log
          if-no-files-found: ignore
