name: Godot validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: route-familiarity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Focused route familiarity validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Run route familiarity smoke test
        run: godot --headless --path . res://scenes/tests/route_familiarity_smoke_test.tscn

      - name: Capture regional map persistence regression
        continue-on-error: true
        shell: bash
        run: |
          timeout 45s godot --headless --path . res://scenes/tests/regional_expedition_map_smoke_test.tscn 2>&1 | tee regional-map-test.log

      - name: Upload regional regression log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: regional-map-test-log
          path: regional-map-test.log
          if-no-files-found: error
          retention-days: 1

      - name: Verify regional map persistence regression
        run: grep -q "REGIONAL_EXPEDITION_MAP_SMOKE_TEST: PASS" regional-map-test.log

      - name: Run Wilds generation regression
        run: godot --headless --path . res://scenes/tests/wilds_expedition_smoke_test.tscn

      - name: Boot regional expedition map
        run: godot --headless --path . res://scenes/levels/prototypes/prototype_regional_expedition_map_v1.tscn --quit-after 4

      - name: Boot Wilds expedition
        run: godot --headless --path . res://scenes/levels/prototypes/prototype_wilds_expedition_v1.tscn --quit-after 4
