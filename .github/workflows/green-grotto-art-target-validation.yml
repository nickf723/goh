name: Green Grotto Art Target

on:
  push:
    branches:
      - main
    paths:
      - "scripts/environment/green_grotto_material_library.gd"
      - "scripts/environment/green_grotto_detail_material_library.gd"
      - "scripts/environment/green_grotto_hero_material_library.gd"
      - "scripts/environment/green_grotto_fauna_visual.gd"
      - "scripts/environment/environment_kit_definition.gd"
      - "scripts/environment/environment_kit_module.gd"
      - "scripts/levels/prototype_green_grotto_art_target.gd"
      - "scripts/levels/prototype_green_grotto_detail_pass.gd"
      - "scripts/levels/prototype_green_grotto_hero_pass.gd"
      - "scripts/levels/prototype_green_grotto_hero_surface_finish.gd"
      - "scripts/levels/prototype_green_grotto_art_direction_study.gd"
      - "scripts/levels/prototype_green_grotto_calibration_kit_pass.gd"
      - "scripts/levels/prototype_green_grotto_lighting_pass.gd"
      - "scripts/tests/green_grotto_art_target_smoke_test.gd"
      - "scripts/tests/green_earth_calibration_kit_smoke_test.gd"
      - "scenes/environment/kits/green_earth/**"
      - "data/environment_kits/green_earth_calibration_kit.tres"
      - "scenes/levels/prototypes/prototype_green_grotto_art_target_v1.tscn"
      - "scenes/tests/green_grotto_art_target_smoke_test.tscn"
      - "scenes/tests/green_earth_calibration_kit_smoke_test.tscn"
      - "docs/GREEN_GROTTO_ART_TARGET_V1.md"
      - "docs/GREEN_GROTTO_HERO_PASS_V3.md"
      - "docs/GLOBAL_ART_BIBLE_V0_1.md"
      - "docs/ENVIRONMENT_ASSET_PRODUCTION_CONTRACT_V0_1.md"
      - "docs/GREEN_EARTH_CALIBRATION_KIT_V0_1.md"
      - ".github/workflows/green-grotto-art-target-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: green-grotto-art-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-green-grotto:
    name: Import, Green art target, calibration kit, and scene boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee green-grotto-import.log

      - name: Run Green Grotto art regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/green_grotto_art_target_smoke_test.tscn 2>&1 | tee green-grotto-test.log

      - name: Run Green Earth calibration kit regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/green_earth_calibration_kit_smoke_test.tscn 2>&1 | tee green-earth-kit-test.log

      - name: Boot Green Grotto art target
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 8 res://scenes/levels/prototypes/prototype_green_grotto_art_target_v1.tscn 2>&1 | tee green-grotto-boot.log

      - name: Upload Green Grotto logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: green-grotto-art-target-logs
          path: |
            green-grotto-import.log
            green-grotto-test.log
            green-earth-kit-test.log
            green-grotto-boot.log
          if-no-files-found: ignore
