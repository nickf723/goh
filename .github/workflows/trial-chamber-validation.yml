name: Trial chamber validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trial-chambers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Trial 001 and Trial 002
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Run Shatter and Climb regression
        run: godot --headless --path . res://scenes/tests/trial_chamber_001_shatter_climb_smoke_test.tscn

      - name: Run Conductive Circuit regression
        run: godot --headless --path . res://scenes/tests/trial_chamber_002_conductive_circuit_smoke_test.tscn
