name: Drowned Bell foundation validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Test Drowned Bell foundation
        shell: bash
        run: |
          set +e
          godot --headless --path . scenes/tests/drowned_bell_foundation_smoke_test.tscn > /tmp/drowned-bell-test.log 2>&1
          status=$?
          grep -E "DROWNED_BELL|SCRIPT ERROR|ERROR:|Invalid|stalled during" /tmp/drowned-bell-test.log > .validation/drowned-bell-diagnostics.txt || true
          if [ $status -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .validation/drowned-bell-diagnostics.txt
            git commit -m "Record Drowned Bell diagnostics" || true
            git push origin HEAD:${{ github.head_ref }}
          fi
          cat .validation/drowned-bell-diagnostics.txt
          exit $status
      - name: Boot Drowned Bell scene
        run: godot --headless --path . scenes/levels/prototypes/prototype_drowned_bell_v1.tscn --quit-after 5
