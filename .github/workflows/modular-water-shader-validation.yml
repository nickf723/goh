name: Modular water shader validation

on:
  pull_request:
    paths-ignore:
      - validation/modular_water_shader_fix.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Load modular water shader and test showcase
        run: timeout 60s godot --headless --path . scenes/tests/modular_environment_showcase_smoke_test.tscn
      - name: Boot modular showcase
        run: timeout 30s godot --headless --path . scenes/levels/prototypes/prototype_modular_environment_showcase_v1.tscn --quit-after 6
